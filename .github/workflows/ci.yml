name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Set environment variables for the tests
      APP_BASE_URL: http://localhost:8000
      APP_BROWSER: chromium
      APP_HEADLESS: true
      APP_TIMEOUT: 15
      APP_IMPLICIT_WAIT: 5
      APP_REPORT_DIR: reports
      # Use dummy credentials for testing
      APP_ADMIN_USER: admin
      APP_ADMIN_PASS: ChangeMe123!
      APP_TEST_USER: tester
      APP_TEST_PASS: TestPass123!
      APP_VIEWPORT_WIDTH: 1366
      APP_VIEWPORT_HEIGHT: 768
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-qa.txt
      - name: Run lint
        run: |
          ruff check tests src
          black --check tests src
      - name: Run tests
        run: |
          pytest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: reports/
