name: QA Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-qa.txt

      - name: Ruff lint
        run: ruff check tests src

      - name: Black format check
        run: black --check tests src

      - name: Acceptance gate
        run: python validate_project.py --ci

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-qa.txt
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements-qa.txt

      - name: Check for hardcoded secrets
        run: |
          if grep -rnE "(password|secret|api[_-]?key|token)[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9+/=]{12,}" src/ tests/ --include="*.py" \
             | grep -v "data-testid" | grep -v "placeholder"; then
            echo "::error::Possible hardcoded secret found"
            exit 1
          fi
          echo "No hardcoded secrets detected."

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        suite: [smoke, functional, regression, e2e]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-qa.txt

      - name: Collect tests
        run: |
          python -m pytest --collect-only -q

      - name: Run ${{ matrix.suite }} suite
        run: |
          python -m pytest -v -n auto --qa-suite=${{ matrix.suite }} --tb=short

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ matrix.suite }}
          path: reports/
