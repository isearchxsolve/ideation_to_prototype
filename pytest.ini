[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --reruns=2
    --reruns-delay=1
    -n auto
markers =
    smoke: critical-path validation
    functional: feature-by-feature coverage
    regression: historical bug repro + edge cases
    e2e: full user journey flows
    login: login feature bucket
    signup: signup feature bucket
    checkout: checkout feature bucket
    dashboard: dashboard feature bucket
    all: runs in every suite
filterwarnings =
    ignore::DeprecationWarning